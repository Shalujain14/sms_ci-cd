services:
  frontend:
    image: shalu1400/sms-frontend-jain:latest
    container_name: sms-frontend
    ports:
      - "5173:5173"
    restart: unless-stopped
    depends_on:
      - backend
  
  backend:
    image: shalu1400/sms-backend-shalu:latest
    container_name: sms-backend
    ports:
      - "8000:8000"
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: sms_db
      MYSQL_USER: smsuser
      MYSQL_PASSWORD: root
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy

  mysql:
    image: mysql:8.0
    container_name: sms-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: sms_db
      MYSQL_USER: smsuser
      MYSQL_PASSWORD: root
    volumes:
      - mysql_data:/var/lib/mysql

    restart: unless-stopped
    healthcheck:
      test: ["CMD","mysqladmin","ping","-h","localhost","-proot"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mysql_data:
